<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>تحويل القرآن - صلاح القرآن</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            background: #f6f1e4;
            color: #1c2b27;
            padding: 30px;
            text-align: center;
        }

        .box {
            max-width: 700px;
            margin: 40px auto;
            background: white;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 8px 30px rgba(0,0,0,.12);
        }

        h1 {
            color: #0e3b36;
            margin-bottom: 15px;
        }

        p {
            line-height: 1.8;
        }

        input {
            margin: 20px 0;
            padding: 10px;
        }

        button {
            background: #0e3b36;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            opacity: .9;
        }

        #status {
            margin-top: 25px;
            line-height: 2;
            font-weight: bold;
        }

    </style>
</head>

<body>

<div class="box">

    <h1>صلاح القرآن</h1>

    <h2>تحويل ملف القرآن</h2>

    <p>
        اختر ملف quran.txt الموجود لديك，
        وسيتم تحويله إلى ملف quran.json.
    </p>

    <input
        type="file"
        id="quranFile"
        accept=".txt"
    >

    <br>

    <button id="convertBtn">
        تحويل القرآن
    </button>

    <div id="status"></div>

</div>


<script>

"use strict";


const fileInput =
    document.getElementById("quranFile");

const convertBtn =
    document.getElementById("convertBtn");

const status =
    document.getElementById("status");


convertBtn.addEventListener("click", async () => {

    const file = fileInput.files[0];

    if (!file) {

        status.textContent =
            "❌ اختر ملف quran.txt أولًا.";

        return;
    }


    try {

        status.textContent =
            "⏳ جاري قراءة الملف...";


        const text =
            await file.text();


        const lines =
            text.split(/\r?\n/);


        const surahs = {};


        for (const line of lines) {

            const cleanLine =
                line.trim();


            if (!cleanLine) {
                continue;
            }


            const parts =
                cleanLine.split("|");


            if (parts.length < 3) {
                continue;
            }


            const surahNumber =
                Number(parts[0]);


            const ayahNumber =
                Number(parts[1]);


            const ayahText =
                parts.slice(2).join("|").trim();


            if (
                !Number.isInteger(surahNumber) ||
                !Number.isInteger(ayahNumber) ||
                !ayahText
            ) {
                continue;
            }


            if (!surahs[surahNumber]) {

                surahs[surahNumber] = {

                    number: surahNumber,

                    ayahs: []

                };

            }


            surahs[surahNumber].ayahs.push({

                number: ayahNumber,

                text: ayahText

            });

        }


        const result = {

            version: 1,

            source: "Tanzil",

            surahs:
                Object.values(surahs)
                .sort((a, b) =>
                    a.number - b.number
                )

        };


        const totalSurahs =
            result.surahs.length;


        const totalAyahs =
            result.surahs.reduce(
                (total, surah) =>
                    total + surah.ayahs.length,
                0
            );


        const json =
            JSON.stringify(
                result,
                null,
                2
            );


        const blob =
            new Blob(
                [json],
                {
                    type:
                        "application/json;charset=utf-8"
                }
            );


        const url =
            URL.createObjectURL(blob);


        const link =
            document.createElement("a");


        link.href = url;

        link.download =
            "quran.json";


        document.body.appendChild(link);

        link.click();

        link.remove();


        URL.revokeObjectURL(url);


        status.innerHTML = `
            ✅ تم التحويل بنجاح!<br><br>

            عدد السور:
            ${totalSurahs}<br>

            عدد الآيات:
            ${totalAyahs}<br><br>

            تم تنزيل ملف:
            <strong>quran.json</strong>
        `;


    } catch (error) {

        console.error(error);

        status.textContent =
            "❌ حدث خطأ أثناء تحويل الملف.";

    }

});

</script>

</body>
</html>
